name: Sync upstream releases
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-release-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      branch: ${{ steps.sync.outputs.branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare upstream release branch
        id: sync
        run: python3 scripts/sync-upstream.py
      - name: Create update pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.sync.outputs.branch }}
          UPDATE_TAG: ${{ steps.sync.outputs.tag }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh pr create --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" \
            --title "Update upstream $UPDATE_TAG for iOS" \
            --body-file .github/upstream-pr-body.md
      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: upstream-sync-logs
          path: build/logs/
          if-no-files-found: ignore
  build:
    needs: sync
    # GITHUB_TOKEN pushes/PRs do not trigger other workflows. Invoke the reusable
    # build explicitly, even when PR creation is disabled in repository settings.
    if: ${{ always() && needs.sync.outputs.changed == 'true' }}
    uses: ./.github/workflows/ios-build.yml
    with:
      source_ref: ${{ needs.sync.outputs.branch }}
      run_native_tests: true
    permissions:
      contents: read
