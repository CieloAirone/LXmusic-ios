name: Sync upstream releases
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-release-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      branch: ${{ steps.sync.outputs.branch }}
      sha: ${{ steps.sync.outputs.sha }}
      tag: ${{ steps.sync.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare upstream release branch
        id: sync
        run: python3 scripts/sync-upstream.py
      - name: Create update pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.sync.outputs.branch }}
          UPDATE_TAG: ${{ steps.sync.outputs.tag }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh pr create --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" \
            --title "Update upstream $UPDATE_TAG for iOS" \
            --body-file .github/upstream-pr-body.md
      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: upstream-sync-logs
          path: build/logs/
          if-no-files-found: ignore
  build:
    needs: sync
    # GITHUB_TOKEN pushes/PRs do not trigger other workflows. Invoke the reusable
    # build explicitly, even when PR creation is disabled in repository settings.
    if: ${{ always() && needs.sync.outputs.changed == 'true' }}
    uses: ./.github/workflows/ios-build.yml
    with:
      source_ref: ${{ needs.sync.outputs.branch }}
      run_native_tests: true
    permissions:
      contents: read

  publish:
    needs: [sync, build]
    if: ${{ always() && needs.build.result == 'success' && needs.sync.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_NUMBER: ${{ github.run_number }}
      SOURCE_SHA: ${{ needs.sync.outputs.sha }}
      SOURCE_TAG: ${{ needs.sync.outputs.tag }}
    steps:
      - name: Verify and publish updated IPA
        run: |
          gh run download "$RUN_ID" --name "LXMusic-iOS-unsigned-$RUN_NUMBER" --dir artifact
          (cd artifact && sha256sum -c LXMusic-unsigned.ipa.sha256 && unzip -tq LXMusic-unsigned.ipa)
          TAG="ios-upstream-$SOURCE_TAG-$RUN_ID"
          printf '自动跟进上游 %s 的非官方 iOS 开发版。\n\nIPA 未签名，安装前需要自行签名。已通过构建和原生测试，尚未经过真机完整验收。\n提交：%s\n' "$SOURCE_TAG" "$SOURCE_SHA" > notes.md
          gh release create "$TAG" artifact/LXMusic-unsigned.ipa artifact/LXMusic-unsigned.ipa.sha256 --target "$SOURCE_SHA" --title "LX Music iOS upstream $SOURCE_TAG" --notes-file notes.md --prerelease
